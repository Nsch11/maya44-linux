# Keep the MAYA44e desktop playback period at 256 frames with two periods.
# Read on WirePlumber startup; changing this file does not reconfigure a stream.
# Other ALSA clients may explicitly negotiate 64, 128, 256, 512 or 1024.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.driver_name = "snd_maya44e"
        node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 256
        api.alsa.period-num = 2
      }
    }
  }
]
