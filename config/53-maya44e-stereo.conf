# WirePlumber 0.5: two stereo endpoints sharing the existing 4-channel PCM.
# Install in ~/.config/wireplumber/wireplumber.conf.d/ and install the Lua
# companion in ~/.local/share/wireplumber/scripts/maya44e-stereo.lua.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.driver_name = "snd_maya44e"
        device.profile.name = "multichannel-output"
        api.alsa.pcm.stream = "playback" }
    ]
    actions = {
      update-props = {
        media.class = "Audio/Sink/Internal"
        node.description = "MAYA44 PCM 1–4"
        node.nick = "MAYA44 PCM 1–4"
      }
    }
  }
]

wireplumber.components = [
  {
    name = "maya44e-stereo.lua"
    type = script/lua
    provides = maya44e.stereo
    requires = [ support.lua-scripting pw.client-node ]
  }
]
wireplumber.profiles = {
  main = {
    maya44e.stereo = required
  }
}
